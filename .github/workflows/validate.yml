name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '8.2', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l
      - name: Validate Composer metadata JSON
        run: |
          php -r 'json_decode(file_get_contents("composer.json"), true); exit(json_last_error() === JSON_ERROR_NONE ? 0 : 1);'
  python-syntax:
    name: Python test helper syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m compileall -q tests
